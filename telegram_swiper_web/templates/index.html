<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Swiper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #a8d8ea 0%, #d4f1f9 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .status-bar {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            color: white;
            text-align: center;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .counter {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .unread-count {
            font-size: 14px;
        }

        /* Настройки */
        .settings-panel {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .settings-panel h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #6bb6d0;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6bb6d0 0%, #a8d8ea 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(107, 182, 208, 0.4);
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        /* Карточка диалога */
        .card-container {
            position: relative;
            height: 500px;
            margin-bottom: 20px;
        }

        .card {
            position: absolute;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: transform 0.3s, opacity 0.3s;
            cursor: grab;
            touch-action: none;
            overflow: hidden;
        }

        .card.dragging {
            cursor: grabbing;
        }

        .card.swiped-left {
            transform: translateX(-150%) rotate(-20deg);
            opacity: 0;
        }

        .card.swiped-right {
            transform: translateX(150%) rotate(20deg);
            opacity: 0;
        }

        .card-header {
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            padding: 20px;
            border-bottom: 2px solid #ddd;
        }

        .card-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .telegram-link {
            display: inline-block;
            background: linear-gradient(135deg, #6bb6d0 0%, #a8d8ea 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            margin: 8px 0;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .telegram-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(107, 182, 208, 0.4);
        }

        .card-date {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .card-unread {
            font-size: 14px;
            color: #ff5722;
            font-weight: bold;
        }

        .card-body {
            padding: 20px;
            max-height: 350px;
            overflow-y: auto;
        }

        .context-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px;
            color: #999;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .message.from-me {
            background: #e3f2fd;
            margin-left: 20px;
        }

        .message.from-client {
            background: #fff3e0;
            margin-right: 20px;
        }

        .message-sender {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .message.from-me .message-sender {
            color: #1976d2;
        }

        .message.from-client .message-sender {
            color: #f57c00;
        }

        .message-text {
            font-size: 14px;
            color: #333;
            line-height: 1.4;
        }

        .unread-section {
            background: #fff9c4;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .unread-message {
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 6px;
            border-left: 4px solid #ff9800;
        }

        /* Кнопки свайпа */
        .swipe-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .swipe-btn {
            flex: 1;
            padding: 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .swipe-btn-left {
            background: #ff9800;
            color: white;
        }

        .swipe-btn-right {
            background: #4caf50;
            color: white;
        }

        .swipe-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .swipe-btn:active {
            transform: translateY(-1px);
        }

        /* Completion screen */
        .completion {
            background: white;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .completion h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .completion p {
            color: #666;
            font-size: 16px;
        }

        /* Hidden state */
        .hidden {
            display: none !important;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 24px;
            }

            .card-container {
                height: 450px;
            }

            .card-body {
                max-height: 300px;
            }
        }

        /* Stats panel */
        .stats-panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #6bb6d0;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        /* Визуальное уведомление */
        .visual-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, #6bb6d0 0%, #a8d8ea 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-weight: bold;
            z-index: 10000;
            transition: transform 0.3s ease;
            max-width: 90%;
            text-align: center;
        }

        .visual-notification.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📱 Telegram Swiper</h1>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="counter" id="counter">0 / 0</div>
            <div class="unread-count" id="unread-count">📊 Диалогов: 0</div>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settings-panel">
            <h2>⚙️ Настройки Telegram</h2>
            <div class="input-group">
                <label>API ID:</label>
                <input type="text" id="api-id" placeholder="Получите на my.telegram.org">
            </div>
            <div class="input-group">
                <label>API Hash:</label>
                <input type="text" id="api-hash" placeholder="Ваш API Hash">
            </div>
            <button class="btn btn-primary" onclick="saveConfig()">💾 Сохранить и подключиться</button>
        </div>

        <!-- Auth Panel -->
        <div class="settings-panel hidden" id="auth-panel">
            <h2>📱 Авторизация</h2>
            <div class="input-group">
                <label>Номер телефона:</label>
                <input type="tel" id="phone" placeholder="+79991234567">
            </div>
            <button class="btn btn-primary" onclick="sendCode()">📲 Отправить код</button>

            <div class="hidden" id="code-input">
                <div class="input-group">
                    <label>Код из Telegram:</label>
                    <input type="text" id="code" placeholder="12345">
                </div>
                <button class="btn btn-success" onclick="verifyCode()">✅ Подтвердить</button>
            </div>

            <div class="hidden" id="password-input">
                <div class="input-group">
                    <label>🔐 Пароль двухфакторной аутентификации:</label>
                    <input type="password" id="password" placeholder="Ваш пароль 2FA">
                </div>
                <button class="btn btn-success" onclick="verifyCode()">✅ Подтвердить с паролем</button>
            </div>

            <button class="btn" style="background: #999; color: white; margin-top: 15px;" onclick="showSettingsPanel()">
                ← Назад к настройкам
            </button>
        </div>

        <!-- Main Panel -->
        <div class="hidden" id="main-panel">
            <button class="btn btn-primary" onclick="loadDialogs()">🔄 Загрузить сообщения</button>

            <!-- Card Container -->
            <div class="card-container" id="card-container">
                <!-- Карточки будут добавляться динамически -->
            </div>

            <!-- Swipe Buttons -->
            <div class="swipe-buttons">
                <button class="swipe-btn swipe-btn-left" onclick="swipeLeft()">
                    <span style="font-size: 24px;">👈</span>
                    <span>Непрочитанное</span>
                    <span style="font-size: 12px;">(вернется)</span>
                </button>
                <button class="swipe-btn swipe-btn-right" onclick="swipeRight()">
                    <span style="font-size: 24px;">✅</span>
                    <span>Обработано</span>
                    <span style="font-size: 12px;">(убрать навсегда)</span>
                </button>
            </div>

            <!-- Stats -->
            <div class="stats-panel hidden" id="stats-panel">
                <h3>📊 Статистика</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="stat-total-dialogs">0</div>
                        <div class="stat-label">Всего диалогов</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-processed-dialogs">0</div>
                        <div class="stat-label">Обработано</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-scans">0</div>
                        <div class="stat-label">Сканирований</div>
                    </div>
                </div>
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <button class="btn btn-primary" onclick="loadMessages()">
                        🔄 Обновить
                    </button>
                    <button class="btn btn-danger" onclick="logout()">
                        🚪 Выйти
                    </button>
                    <button class="btn btn-danger" onclick="clearHistory()">
                        🗑️ Очистить историю
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- WebSocket & App Logic -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/app.js"></script>

    <!-- Keyboard shortcuts -->
    <script>
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') swipeLeft();
            if (e.key === 'ArrowRight' || e.key === ' ') swipeRight();
        });
    </script>
</body>
</html>
