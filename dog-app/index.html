<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<title>DogCare</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-light: #eef2ff;
    --danger: #dc2626;
    --danger-light: #fef2f2;
    --warn: #d97706;
    --warn-light: #fffbeb;
    --ok: #16a34a;
    --ok-light: #f0fdf4;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  #app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  /* ---------- Auth ---------- */
  .auth-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; }
  .auth-logo { text-align: center; margin-bottom: 24px; }
  .auth-logo .emoji { font-size: 64px; }
  .auth-logo h1 { font-size: 28px; margin-top: 8px; }
  .auth-logo p { color: var(--muted); margin-top: 4px; font-size: 15px; }
  .lang-row { display: flex; justify-content: center; margin-bottom: 16px; }
  .lang-row select { width: auto; padding: 8px 12px; font-size: 14px; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  }
  label.field { display: block; margin-bottom: 14px; }
  label.field span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; padding: 12px 14px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 12px; background: #fff; color: var(--text);
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); }
  .btn {
    display: block; width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
    border: none; border-radius: 12px; cursor: pointer; text-align: center;
    background: var(--primary); color: #fff;
  }
  .btn.secondary { background: var(--primary-light); color: var(--primary); }
  .btn.small { width: auto; display: inline-block; padding: 8px 14px; font-size: 14px; }
  .btn.danger { background: var(--danger-light); color: var(--danger); }
  .btn.oauth {
    background: #fff; color: var(--text); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;
  }
  .btn.oauth.apple { background: #000; color: #fff; border-color: #000; }
  .link-btn { background: none; border: none; color: var(--primary); font-size: 15px; cursor: pointer; padding: 12px; width: 100%; }
  .error-msg { color: var(--danger); font-size: 14px; margin-bottom: 10px; display: none; }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; margin: 14px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  /* ---------- Layout ---------- */
  header.topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 14px 18px; padding-top: calc(14px + env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between;
  }
  header.topbar h2 { font-size: 20px; }
  main.content { flex: 1; padding: 16px; padding-bottom: 90px; }
  nav.tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    max-width: 520px; margin: 0 auto;
    background: var(--card); border-top: 1px solid var(--border);
    display: flex; padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabbar button {
    flex: 1; background: none; border: none; padding: 10px 4px 8px;
    font-size: 11px; color: var(--muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  nav.tabbar button .ico { font-size: 22px; }
  nav.tabbar button.active { color: var(--primary); font-weight: 600; }

  .section-title { font-size: 17px; font-weight: 700; margin: 18px 0 10px; }
  .empty { text-align: center; color: var(--muted); padding: 36px 16px; }
  .empty .emoji { font-size: 48px; display: block; margin-bottom: 10px; }

  /* ---------- Pets ---------- */
  .pet-card { display: flex; gap: 14px; align-items: center; }
  .pet-avatar {
    width: 56px; height: 56px; border-radius: 50%; background: var(--primary-light);
    display: flex; align-items: center; justify-content: center; font-size: 30px; flex-shrink: 0;
  }
  .pet-card .info { flex: 1; min-width: 0; }
  .pet-card .name { font-weight: 700; font-size: 17px; }
  .pet-card .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* ---------- Rows ---------- */
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .row + .row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .row .main { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; font-size: 15px; }
  .row .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .amount { font-weight: 700; font-size: 15px; white-space: nowrap; }

  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .badge.ok { background: var(--ok-light); color: var(--ok); }
  .badge.warn { background: var(--warn-light); color: var(--warn); }
  .badge.danger { background: var(--danger-light); color: var(--danger); }
  .badge.info { background: var(--primary-light); color: var(--primary); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .stat-card .label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .stat-card .value { font-size: 22px; font-weight: 800; margin-top: 4px; }

  .cat-bar { height: 8px; border-radius: 4px; background: var(--primary); margin-top: 4px; }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 50;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal {
    background: var(--card); width: 100%; max-width: 520px;
    border-radius: 20px 20px 0 0; padding: 20px 18px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y: auto;
  }
  .modal h3 { font-size: 19px; margin-bottom: 16px; }
  .modal .actions { display: flex; gap: 10px; margin-top: 8px; }
  .hidden { display: none !important; }

  /* ---------- Vaccine guide ---------- */
  details.vax-guide { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; }
  details.vax-guide summary {
    padding: 14px 16px; font-weight: 600; cursor: pointer; list-style: none;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  details.vax-guide summary::after { content: "›"; transform: rotate(90deg); color: var(--muted); font-size: 18px; }
  details.vax-guide[open] summary::after { transform: rotate(-90deg); }
  details.vax-guide .body { padding: 0 16px 14px; color: var(--muted); font-size: 14px; line-height: 1.55; }
  details.vax-guide .body b { color: var(--text); }
  .notice {
    background: var(--primary-light); border-radius: var(--radius);
    padding: 14px 16px; font-size: 14px; line-height: 1.5; margin-bottom: 14px;
  }
</style>
<!-- Firebase (облачные аккаунты и синхронизация). Работает после настройки firebase-config.js -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" onerror="void 0"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" onerror="void 0"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" onerror="void 0"></script>
<script src="firebase-config.js"></script>
<!-- Переводы: 24 официальных языка ЕС + русский -->
<script src="i18n/base.js"></script>
<script src="i18n/lang-west.js"></script>
<script src="i18n/lang-east.js"></script>
<script src="i18n/lang-north.js"></script>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ===================== Локализация ===================== */
const LS_LANG = "dogcare_lang";
function detectLang() {
  const saved = localStorage.getItem(LS_LANG);
  if (saved && I18N[saved]) return saved;
  const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
  return I18N[nav] ? nav : "en";
}
let lang = detectLang();
function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
function setLang(l) {
  lang = l;
  localStorage.setItem(LS_LANG, l);
  document.documentElement.lang = l;
}
document.documentElement.lang = lang;
function langSelect(id) {
  return `<select id="${id}">${LANGS.map(([code, name]) =>
    `<option value="${code}" ${code === lang ? "selected" : ""}>${name}</option>`).join("")}</select>`;
}

/* =====================================================
   Справочник прививок для собак в ЕС
   (WSAVA + Регламент ЕС 576/2013), тексты — в i18n
   ===================================================== */
const EU_VACCINES = [
  { id: "rabies", required: true,  tagKey: "t_required",    firstWeeks: 12, puppySeries: [12],       boosterMonths: 12 },
  { id: "dhp",    required: true,  tagKey: "t_core",        firstWeeks: 8,  puppySeries: [8, 12, 16], boosterMonths: 12 },
  { id: "lepto",  required: true,  tagKey: "t_recommended", firstWeeks: 8,  puppySeries: [8, 12],     boosterMonths: 12 },
  { id: "pi",     required: false, tagKey: "t_optional",    firstWeeks: 8,  puppySeries: [8, 12],     boosterMonths: 12 },
  { id: "kc",     required: false, tagKey: "t_optional",    firstWeeks: 8,  puppySeries: [8],         boosterMonths: 12 },
  { id: "leish",  required: false, tagKey: "t_south",       firstWeeks: 26, puppySeries: [26],        boosterMonths: 12 }
];

const EXPENSE_CATEGORIES = [
  { id: "food",      key: "cat_food",  emoji: "🍖" },
  { id: "vet",       key: "cat_vet",   emoji: "🩺" },
  { id: "meds",      key: "cat_meds",  emoji: "💊" },
  { id: "groom",     key: "cat_groom", emoji: "✂️" },
  { id: "toys",      key: "cat_toys",  emoji: "🧸" },
  { id: "gear",      key: "cat_gear",  emoji: "🦮" },
  { id: "insurance", key: "cat_ins",   emoji: "🛡️" },
  { id: "other",     key: "cat_other", emoji: "📦" }
];

const AVATARS = ["🐕","🐩","🦮","🐕‍🦺","🐶","🐾"];

/* ===================== Хранилище ===================== */
const LS_USERS = "dogcare_users";
const LS_SESSION = "dogcare_session_v2";
const LS_PENDING_EMAIL = "dogcare_pending_email";

function loadUsers() { return JSON.parse(localStorage.getItem(LS_USERS) || "{}"); }
function saveUsers(u) { localStorage.setItem(LS_USERS, JSON.stringify(u)); }

let currentUser = null; // { type: 'local'|'cloud', id, name, email }
let state = null;
let activeTab = "pets";

function dataKey(user) { return "dogcare_data_" + (user.type === "cloud" ? "cloud_" + user.id : user.email); }
function loadState() {
  const raw = localStorage.getItem(dataKey(currentUser));
  state = raw ? JSON.parse(raw) : { pets: [], expenses: [], vaccinations: [] };
}

/* --- Облако (Firebase) --- */
const cloudReady = typeof firebase !== "undefined" && window.FIREBASE_CONFIG;
let db = null;
if (cloudReady) {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  db = firebase.firestore();
}
let cloudSaveTimer = null;
function saveState() {
  localStorage.setItem(dataKey(currentUser), JSON.stringify(state));
  if (cloudReady && currentUser?.type === "cloud") {
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(() => {
      db.collection("users").doc(currentUser.id).set({
        data: state,
        name: currentUser.name || "",
        email: currentUser.email || "",
        updated: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(() => {});
    }, 700);
  }
}
async function loadCloudState() {
  try {
    const doc = await db.collection("users").doc(currentUser.id).get();
    if (doc.exists && doc.data().data) state = doc.data().data;
    else { loadState(); saveState(); }
  } catch (e) { loadState(); }
  localStorage.setItem(dataKey(currentUser), JSON.stringify(state));
}

async function hash(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ===================== Утилиты ===================== */
const $ = sel => document.querySelector(sel);
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function fmtDate(iso) {
  if (!iso) return "";
  return new Date(iso + "T00:00:00").toLocaleDateString(lang, { day: "numeric", month: "short", year: "numeric" });
}
function fmtMoney(n) { return (Math.round(n * 100) / 100).toLocaleString(lang) + " €"; }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function addDays(iso, days) {
  const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function addMonths(iso, months) {
  const d = new Date(iso + "T00:00:00"); d.setMonth(d.getMonth() + months);
  return d.toISOString().slice(0, 10);
}
function daysUntil(iso) {
  const ms = new Date(iso + "T00:00:00") - new Date(todayISO() + "T00:00:00");
  return Math.round(ms / 86400000);
}
function petAge(birth) {
  if (!birth) return "";
  const b = new Date(birth + "T00:00:00"), now = new Date();
  let months = (now.getFullYear() - b.getFullYear()) * 12 + (now.getMonth() - b.getMonth());
  if (now.getDate() < b.getDate()) months--;
  if (months < 0) months = 0;
  const y = Math.floor(months / 12), m = months % 12;
  if (y === 0) return m + " " + t("age_m");
  return y + " " + t("age_y") + (m ? " " + m + " " + t("age_m") : "");
}
function petById(id) { return state.pets.find(p => p.id === id); }
function catById(id) { return EXPENSE_CATEGORIES.find(c => c.id === id) || EXPENSE_CATEGORIES[EXPENSE_CATEGORIES.length - 1]; }
function vaxById(id) { return EU_VACCINES.find(v => v.id === id); }
function vaxName(id) { return t("v_" + id + "_n"); }

/* ===================== Вход в облачный аккаунт ===================== */
async function cloudLoginFromUser(fbUser) {
  currentUser = {
    type: "cloud",
    id: fbUser.uid,
    name: fbUser.displayName || (fbUser.email ? fbUser.email.split("@")[0] : "User"),
    email: fbUser.email || ""
  };
  localStorage.setItem(LS_SESSION, JSON.stringify(currentUser));
  await loadCloudState();
  renderApp();
  checkVaxNotifications();
}

function authError(e) {
  const el = $("#auth-error");
  if (el) { el.textContent = t("cloud_err") + (e && e.message ? e.message : e); el.style.display = "block"; }
}

async function signInProvider(kind) {
  const provider = kind === "google"
    ? new firebase.auth.GoogleAuthProvider()
    : new firebase.auth.OAuthProvider("apple.com");
  try {
    await firebase.auth().signInWithPopup(provider);
  } catch (e) {
    if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) {
      firebase.auth().signInWithRedirect(provider);
    } else authError(e);
  }
}

async function sendMagicLink() {
  const email = $("#auth-email") ? $("#auth-email").value.trim().toLowerCase() : "";
  if (!/^\S+@\S+\.\S+$/.test(email)) { authError(t("magic_email_first")); return; }
  try {
    await firebase.auth().sendSignInLinkToEmail(email, {
      url: location.origin + location.pathname,
      handleCodeInApp: true
    });
    localStorage.setItem(LS_PENDING_EMAIL, email);
    alert(t("magic_sent"));
  } catch (e) { authError(e); }
}

async function completeMagicLink() {
  if (!cloudReady) return false;
  if (!firebase.auth().isSignInWithEmailLink(location.href)) return false;
  let email = localStorage.getItem(LS_PENDING_EMAIL);
  if (!email) email = window.prompt(t("email"));
  if (!email) return false;
  try {
    await firebase.auth().signInWithEmailLink(email, location.href);
    localStorage.removeItem(LS_PENDING_EMAIL);
    history.replaceState(null, "", location.pathname);
    return true;
  } catch (e) { alert(t("cloud_err") + (e.message || e)); return false; }
}

/* ===================== Экран входа ===================== */
function renderAuth(mode = "login") {
  const isReg = mode === "register";
  $("#app").innerHTML = `
    <div class="auth-wrap">
      <div class="auth-logo">
        <span class="emoji">🐕</span>
        <h1>DogCare</h1>
        <p>${t("tagline")}</p>
      </div>
      <div class="lang-row">${langSelect("auth-lang")}</div>
      <div class="card">
        <p class="error-msg" id="auth-error"></p>
        ${cloudReady ? `
          <button class="btn oauth apple" id="btn-apple"> Apple ID</button>
          <button class="btn oauth" id="btn-google">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.2 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.2 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C41 35.4 44 30.2 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
            Google / Gmail</button>
          <label class="field" style="margin-top:6px"><span>${t("email")}</span>
            <input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email">
          </label>
          <button class="btn secondary" id="btn-magic">✉️ ${t("magic")}</button>
          <div class="divider">${t("or")}</div>
        ` : `<div class="notice" style="margin-bottom:14px">☁️ ${t("cloud_off")}</div>`}
        <div style="font-weight:700;font-size:14px;color:var(--muted);margin-bottom:10px">${t("local_login_title")}</div>
        ${isReg ? `
        <label class="field"><span>${t("your_name")}</span>
          <input id="reg-name" type="text" autocomplete="name">
        </label>` : ""}
        <label class="field"><span>${t("email")}</span>
          <input id="local-email" type="email" placeholder="you@example.com" autocomplete="email">
        </label>
        <label class="field"><span>${t("password")}</span>
          <input id="auth-pass" type="password" placeholder="••••••••" autocomplete="${isReg ? "new-password" : "current-password"}">
        </label>
        <button class="btn" id="auth-submit">${isReg ? t("signup") : t("signin")}</button>
      </div>
      <button class="link-btn" id="auth-switch">${isReg ? t("have_acc") : t("no_acc")}</button>
    </div>`;

  $("#auth-lang").onchange = e => { setLang(e.target.value); renderAuth(mode); };
  $("#auth-switch").onclick = () => renderAuth(isReg ? "login" : "register");
  if (cloudReady) {
    $("#btn-google").onclick = () => signInProvider("google");
    $("#btn-apple").onclick = () => signInProvider("apple");
    $("#btn-magic").onclick = sendMagicLink;
  }

  $("#auth-submit").onclick = async () => {
    const email = $("#local-email").value.trim().toLowerCase();
    const pass = $("#auth-pass").value;
    const err = $("#auth-error");
    const showErr = m => { err.textContent = m; err.style.display = "block"; };

    if (!/^\S+@\S+\.\S+$/.test(email)) return showErr(t("err_email"));
    if (pass.length < 4) return showErr(t("err_pass"));

    const users = loadUsers();
    let name;
    if (isReg) {
      name = $("#reg-name").value.trim();
      if (!name) return showErr(t("err_name"));
      if (users[email]) return showErr(t("err_exists"));
      users[email] = { name, passHash: await hash(pass), created: todayISO() };
      saveUsers(users);
    } else {
      const u = users[email];
      if (!u || u.passHash !== await hash(pass)) return showErr(t("err_cred"));
      name = u.name;
    }
    currentUser = { type: "local", id: "local:" + email, name, email };
    localStorage.setItem(LS_SESSION, JSON.stringify(currentUser));
    loadState();
    renderApp();
  };
}

/* ===================== Основной каркас ===================== */
const TABS = [
  { id: "pets",     key: "tab_pets",    ico: "🐾" },
  { id: "expenses", key: "tab_exp",     ico: "💶" },
  { id: "vax",      key: "tab_vax",     ico: "💉" },
  { id: "profile",  key: "tab_profile", ico: "👤" }
];

function renderApp() {
  const tab = TABS.find(x => x.id === activeTab);
  $("#app").innerHTML = `
    <header class="topbar">
      <h2>${tab.ico} ${t(tab.key)}</h2>
      <span id="topbar-extra"></span>
    </header>
    <main class="content" id="content"></main>
    <nav class="tabbar">
      ${TABS.map(x => `
        <button data-tab="${x.id}" class="${x.id === activeTab ? "active" : ""}">
          <span class="ico">${x.ico}</span>${t(x.key)}
        </button>`).join("")}
    </nav>
    <div id="modal-root"></div>`;

  document.querySelectorAll("nav.tabbar button").forEach(b => {
    b.onclick = () => { activeTab = b.dataset.tab; renderApp(); };
  });

  ({ pets: renderPets, expenses: renderExpenses, vax: renderVax, profile: renderProfile }[activeTab])();
}

/* ===================== Модальные окна ===================== */
function openModal(html, onMount) {
  $("#modal-root").innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">${html}</div>
    </div>`;
  $("#modal-backdrop").addEventListener("click", e => { if (e.target.id === "modal-backdrop") closeModal(); });
  if (onMount) onMount();
}
function closeModal() { $("#modal-root").innerHTML = ""; }

/* ===================== Питомцы ===================== */
function renderPets() {
  const c = $("#content");
  const list = state.pets.map(p => `
    <div class="card pet-card" data-id="${p.id}">
      <div class="pet-avatar">${p.avatar}</div>
      <div class="info">
        <div class="name">${esc(p.name)}</div>
        <div class="meta">${esc(p.breed || t("no_breed"))} · ${petAge(p.birth) || t("no_age")}${p.weight ? " · " + p.weight + " kg" : ""}</div>
        ${p.chip ? `<div class="meta">${t("chip_lbl")} ${esc(p.chip)}</div>` : `<div class="meta"><span class="badge warn">${t("no_chip")}</span></div>`}
      </div>
      <span style="color:var(--muted)">›</span>
    </div>`).join("");

  c.innerHTML = `
    ${state.pets.length === 0 ? `
      <div class="empty"><span class="emoji">🐶</span>${t("empty_pets")}</div>` : list}
    <button class="btn" id="add-pet">${t("add_pet")}</button>`;

  $("#add-pet").onclick = () => petForm();
  document.querySelectorAll(".pet-card").forEach(el => {
    el.onclick = () => petForm(petById(el.dataset.id));
  });
}

function petForm(pet) {
  const isEdit = !!pet;
  openModal(`
    <h3>${isEdit ? esc(pet.name) : t("new_pet")}</h3>
    <label class="field"><span>${t("avatar")}</span>
      <select id="p-avatar">${AVATARS.map(a => `<option ${pet?.avatar === a ? "selected" : ""}>${a}</option>`).join("")}</select>
    </label>
    <label class="field"><span>${t("pet_name")}</span><input id="p-name" value="${esc(pet?.name || "")}" placeholder="Rex"></label>
    <label class="field"><span>${t("breed")}</span><input id="p-breed" value="${esc(pet?.breed || "")}"></label>
    <label class="field"><span>${t("sex")}</span>
      <select id="p-sex">
        <option value="m" ${pet?.sex === "m" ? "selected" : ""}>${t("male")}</option>
        <option value="f" ${pet?.sex === "f" ? "selected" : ""}>${t("female")}</option>
      </select>
    </label>
    <label class="field"><span>${t("birth")}</span><input id="p-birth" type="date" value="${pet?.birth || ""}" max="${todayISO()}"></label>
    <label class="field"><span>${t("weight")}</span><input id="p-weight" type="number" step="0.1" min="0" value="${pet?.weight ?? ""}"></label>
    <label class="field"><span>${t("chip")}</span><input id="p-chip" value="${esc(pet?.chip || "")}" placeholder="ISO 15"></label>
    <div class="actions">
      ${isEdit ? `<button class="btn danger" id="p-delete">${t("delete")}</button>` : ""}
      <button class="btn secondary" id="p-cancel">${t("cancel")}</button>
      <button class="btn" id="p-save">${t("save")}</button>
    </div>`, () => {
    $("#p-cancel").onclick = closeModal;
    if (isEdit) $("#p-delete").onclick = () => {
      if (!confirm(t("del_pet", { name: pet.name }))) return;
      state.pets = state.pets.filter(p => p.id !== pet.id);
      state.expenses = state.expenses.filter(e => e.petId !== pet.id);
      state.vaccinations = state.vaccinations.filter(v => v.petId !== pet.id);
      saveState(); closeModal(); renderApp();
    };
    $("#p-save").onclick = () => {
      const name = $("#p-name").value.trim();
      if (!name) { alert(t("name_req")); return; }
      const data = {
        avatar: $("#p-avatar").value, name,
        breed: $("#p-breed").value.trim(),
        sex: $("#p-sex").value,
        birth: $("#p-birth").value,
        weight: $("#p-weight").value ? parseFloat($("#p-weight").value) : null,
        chip: $("#p-chip").value.trim()
      };
      if (isEdit) Object.assign(pet, data);
      else {
        const newPet = { id: uid(), ...data };
        state.pets.push(newPet);
        saveState(); closeModal();
        if (newPet.birth && confirm(t("gen_confirm", { name: newPet.name }))) {
          generateEUSchedule(newPet);
          activeTab = "vax";
        }
        renderApp();
        return;
      }
      saveState(); closeModal(); renderApp();
    };
  });
}

/* ===================== Затраты ===================== */
function renderExpenses() {
  const c = $("#content");
  const monthKey = new Date().toISOString().slice(0, 7);
  const monthExp = state.expenses.filter(e => e.date.startsWith(monthKey));
  const monthTotal = monthExp.reduce((s, e) => s + e.amount, 0);
  const allTotal = state.expenses.reduce((s, e) => s + e.amount, 0);

  const byCat = {};
  monthExp.forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + e.amount; });
  const maxCat = Math.max(1, ...Object.values(byCat));
  const catStats = Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([id, sum]) => {
    const cat = catById(id);
    return `<div style="margin-bottom:10px">
      <div class="row" style="border:none;padding:0;margin:0">
        <span style="font-size:14px">${cat.emoji} ${t(cat.key)}</span>
        <span class="amount" style="font-size:14px">${fmtMoney(sum)}</span>
      </div>
      <div class="cat-bar" style="width:${Math.round(sum / maxCat * 100)}%"></div>
    </div>`;
  }).join("");

  const sorted = [...state.expenses].sort((a, b) => b.date.localeCompare(a.date));
  const rows = sorted.slice(0, 50).map(e => {
    const cat = catById(e.cat);
    const pet = petById(e.petId);
    return `<div class="row" data-id="${e.id}">
      <div class="main">
        <div class="title">${cat.emoji} ${t(cat.key)}${e.note ? " — " + esc(e.note) : ""}</div>
        <div class="sub">${fmtDate(e.date)}${pet ? " · " + pet.avatar + " " + esc(pet.name) : ""}</div>
      </div>
      <span class="amount">${fmtMoney(e.amount)}</span>
    </div>`;
  }).join("");

  c.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="label">${t("month_total")}</div><div class="value">${fmtMoney(monthTotal)}</div></div>
      <div class="stat-card"><div class="label">${t("all_total")}</div><div class="value">${fmtMoney(allTotal)}</div></div>
    </div>
    ${catStats ? `<div class="card"><div class="section-title" style="margin-top:0">${t("by_cat")}</div>${catStats}</div>` : ""}
    <button class="btn" id="add-exp">${t("add_exp")}</button>
    <div class="section-title">${t("history")}</div>
    ${rows ? `<div class="card">${rows}</div>` : `<div class="empty"><span class="emoji">💶</span>${t("empty_exp")}</div>`}`;

  $("#add-exp").onclick = () => expenseForm();
  document.querySelectorAll(".row[data-id]").forEach(el => {
    el.onclick = () => expenseForm(state.expenses.find(e => e.id === el.dataset.id));
  });
}

function expenseForm(exp) {
  const isEdit = !!exp;
  openModal(`
    <h3>${isEdit ? t("edit_exp") : t("new_exp")}</h3>
    <label class="field"><span>${t("amount")}</span>
      <input id="e-amount" type="number" step="0.01" min="0" inputmode="decimal" value="${exp?.amount ?? ""}" placeholder="0.00">
    </label>
    <label class="field"><span>${t("category")}</span>
      <select id="e-cat">${EXPENSE_CATEGORIES.map(cat =>
        `<option value="${cat.id}" ${exp?.cat === cat.id ? "selected" : ""}>${cat.emoji} ${t(cat.key)}</option>`).join("")}
      </select>
    </label>
    <label class="field"><span>${t("pet")}</span>
      <select id="e-pet">
        <option value="">${t("general_exp")}</option>
        ${state.pets.map(p => `<option value="${p.id}" ${exp?.petId === p.id ? "selected" : ""}>${p.avatar} ${esc(p.name)}</option>`).join("")}
      </select>
    </label>
    <label class="field"><span>${t("date")}</span><input id="e-date" type="date" value="${exp?.date || todayISO()}"></label>
    <label class="field"><span>${t("note")}</span><input id="e-note" value="${esc(exp?.note || "")}"></label>
    <div class="actions">
      ${isEdit ? `<button class="btn danger" id="e-delete">${t("delete")}</button>` : ""}
      <button class="btn secondary" id="e-cancel">${t("cancel")}</button>
      <button class="btn" id="e-save">${t("save")}</button>
    </div>`, () => {
    $("#e-cancel").onclick = closeModal;
    if (isEdit) $("#e-delete").onclick = () => {
      state.expenses = state.expenses.filter(x => x.id !== exp.id);
      saveState(); closeModal(); renderApp();
    };
    $("#e-save").onclick = () => {
      const amount = parseFloat($("#e-amount").value);
      if (!(amount > 0)) { alert(t("amount_req")); return; }
      const data = {
        amount, cat: $("#e-cat").value, petId: $("#e-pet").value || null,
        date: $("#e-date").value || todayISO(), note: $("#e-note").value.trim()
      };
      if (isEdit) Object.assign(exp, data);
      else state.expenses.push({ id: uid(), ...data });
      saveState(); closeModal(); renderApp();
    };
  });
}

/* ===================== Прививки ===================== */
function generateEUSchedule(pet) {
  const birth = pet.birth;
  if (!birth) return;
  EU_VACCINES.forEach(v => {
    if (!v.required && v.id !== "pi") return;
    v.puppySeries.forEach(weeks => {
      let due = addDays(birth, weeks * 7);
      if (daysUntil(due) < 0) due = todayISO();
      const dup = state.vaccinations.find(x => x.petId === pet.id && x.vaxId === v.id && x.due === due && !x.done);
      if (!dup) state.vaccinations.push({ id: uid(), petId: pet.id, vaxId: v.id, due, done: false, doneDate: null });
    });
  });
  saveState();
}

function renderVax() {
  const c = $("#content");
  const items = state.vaccinations
    .filter(v => petById(v.petId))
    .sort((a, b) => (a.done === b.done ? a.due.localeCompare(b.due) : a.done - b.done));

  const upcoming = items.filter(v => !v.done);
  const done = items.filter(v => v.done).sort((a, b) => (b.doneDate || "").localeCompare(a.doneDate || ""));

  const renderItem = v => {
    const pet = petById(v.petId);
    const d = daysUntil(v.due);
    let badge;
    if (v.done) badge = `<span class="badge ok">✓ ${fmtDate(v.doneDate)}</span>`;
    else if (d < 0) badge = `<span class="badge danger">${t("overdue", { n: -d })}</span>`;
    else if (d === 0) badge = `<span class="badge warn">${t("today_x")}</span>`;
    else if (d <= 14) badge = `<span class="badge warn">${t("in_days", { n: d })}</span>`;
    else badge = `<span class="badge info">${fmtDate(v.due)}</span>`;
    return `<div class="row" data-vid="${v.id}">
      <div class="main">
        <div class="title">${esc(vaxName(v.vaxId))}</div>
        <div class="sub">${pet.avatar} ${esc(pet.name)}${!v.done ? " · " + fmtDate(v.due) : ""}</div>
      </div>
      ${badge}
    </div>`;
  };

  c.innerHTML = `
    <div class="notice">
      🇪🇺 <b>${t("travel_title")}</b><br>
      ${[1,2,3,4,5,6].map(i => "• " + t("r" + i)).join("<br>")}
    </div>
    ${state.pets.length === 0 ? `<div class="empty"><span class="emoji">💉</span>${t("vax_need_pet")}</div>` : `
      <button class="btn" id="add-vax">${t("add_vax")}</button>
      <button class="btn secondary" id="gen-vax" style="margin-top:10px">📋 ${t("gen_plan")}</button>
      <div class="section-title">${t("upcoming")}</div>
      ${upcoming.length ? `<div class="card">${upcoming.map(renderItem).join("")}</div>`
        : `<div class="empty">${t("none_planned")}</div>`}
      ${done.length ? `<div class="section-title">${t("completed")}</div><div class="card">${done.map(renderItem).join("")}</div>` : ""}
    `}
    <div class="section-title">${t("guide_title")}</div>
    ${EU_VACCINES.map(v => `
      <details class="vax-guide">
        <summary>${esc(vaxName(v.id))} <span class="badge ${v.required ? "danger" : "info"}" style="margin-left:auto">${t(v.tagKey)}</span></summary>
        <div class="body">${esc(t("v_" + v.id + "_d"))}<br><br><b>${t("scheme")}</b> ${t("first_from", { n: v.firstWeeks })}${v.puppySeries.length > 1 ? " (" + v.puppySeries.join(", ") + " " + t("weeks_short") + ")" : ""}. ${esc(t("v_" + v.id + "_note"))}.</div>
      </details>`).join("")}
    <p style="color:var(--muted);font-size:12px;margin-top:10px">${t("disclaimer")}</p>`;

  if ($("#add-vax")) $("#add-vax").onclick = () => vaxForm();
  if ($("#gen-vax")) $("#gen-vax").onclick = () => {
    const withBirth = state.pets.filter(p => p.birth);
    if (!withBirth.length) { alert(t("need_birth")); return; }
    withBirth.forEach(generateEUSchedule);
    renderApp();
  };
  document.querySelectorAll(".row[data-vid]").forEach(el => {
    el.onclick = () => vaxForm(state.vaccinations.find(v => v.id === el.dataset.vid));
  });
}

function vaxForm(rec) {
  const isEdit = !!rec;
  openModal(`
    <h3>${isEdit ? t("vax_title") : t("new_vax")}</h3>
    <label class="field"><span>${t("pet")} *</span>
      <select id="v-pet">${state.pets.map(p =>
        `<option value="${p.id}" ${rec?.petId === p.id ? "selected" : ""}>${p.avatar} ${esc(p.name)}</option>`).join("")}
      </select>
    </label>
    <label class="field"><span>${t("vaccine")}</span>
      <select id="v-vax">${EU_VACCINES.map(v =>
        `<option value="${v.id}" ${rec?.vaxId === v.id ? "selected" : ""}>${esc(vaxName(v.id))}</option>`).join("")}
      </select>
    </label>
    <label class="field"><span>${t("due")}</span><input id="v-due" type="date" value="${rec?.due || todayISO()}"></label>
    ${isEdit && !rec.done ? `<div class="actions"><button class="btn" id="v-done" style="background:var(--ok)">✓ ${t("mark_done")}</button></div>` : ""}
    <div class="actions">
      ${isEdit ? `<button class="btn danger" id="v-delete">${t("delete")}</button>` : ""}
      <button class="btn secondary" id="v-cancel">${t("cancel")}</button>
      <button class="btn" id="v-save">${t("save")}</button>
    </div>`, () => {
    $("#v-cancel").onclick = closeModal;
    if (isEdit) {
      $("#v-delete").onclick = () => {
        state.vaccinations = state.vaccinations.filter(x => x.id !== rec.id);
        saveState(); closeModal(); renderApp();
      };
      const doneBtn = $("#v-done");
      if (doneBtn) doneBtn.onclick = () => {
        rec.done = true;
        rec.doneDate = todayISO();
        const vax = vaxById(rec.vaxId);
        if (vax?.boosterMonths) {
          const nextDue = addMonths(todayISO(), vax.boosterMonths);
          state.vaccinations.push({ id: uid(), petId: rec.petId, vaxId: rec.vaxId, due: nextDue, done: false, doneDate: null });
          alert(t("booster_created", { date: fmtDate(nextDue) }));
        }
        saveState(); closeModal(); renderApp();
      };
    }
    $("#v-save").onclick = () => {
      const petId = $("#v-pet").value;
      const due = $("#v-due").value;
      if (!petId || !due) { alert(t("fill_req")); return; }
      const data = { petId, vaxId: $("#v-vax").value, due };
      if (isEdit) Object.assign(rec, data);
      else state.vaccinations.push({ id: uid(), ...data, done: false, doneDate: null });
      saveState(); closeModal(); renderApp();
    };
  });
}

/* ===================== Профиль ===================== */
function renderProfile() {
  const overdue = state.vaccinations.filter(v => !v.done && daysUntil(v.due) < 0 && petById(v.petId)).length;
  const upcoming14 = state.vaccinations.filter(v => !v.done && daysUntil(v.due) >= 0 && daysUntil(v.due) <= 14 && petById(v.petId)).length;
  const isCloud = currentUser.type === "cloud";

  $("#content").innerHTML = `
    <div class="card" style="text-align:center;padding:24px">
      <div style="font-size:52px">👤</div>
      <div style="font-weight:800;font-size:20px;margin-top:6px">${esc(currentUser.name)}</div>
      <div style="color:var(--muted);font-size:14px">${esc(currentUser.email)}</div>
      <div style="margin-top:8px"><span class="badge ${isCloud ? "ok" : "info"}">${isCloud ? "☁️ " + t("cloud_note") : "📱 " + t("local_note")}</span></div>
    </div>
    <div class="card">
      <label class="field" style="margin-bottom:0"><span>🌐 ${t("language")}</span>${langSelect("profile-lang")}</label>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="label">${t("stat_pets")}</div><div class="value">${state.pets.length}</div></div>
      <div class="stat-card"><div class="label">${t("stat_exp")}</div><div class="value">${state.expenses.length}</div></div>
      <div class="stat-card"><div class="label">${t("stat_overdue")}</div><div class="value" style="color:${overdue ? "var(--danger)" : "var(--ok)"}">${overdue}</div></div>
      <div class="stat-card"><div class="label">${t("stat_up14")}</div><div class="value" style="color:${upcoming14 ? "var(--warn)" : "var(--ok)"}">${upcoming14}</div></div>
    </div>
    <button class="btn secondary" id="notif-btn">🔔 ${t("notif_btn")}</button>
    <button class="btn secondary" id="export-btn" style="margin-top:10px">📤 ${t("export_btn")}</button>
    <button class="btn danger" id="logout-btn" style="margin-top:10px">${t("logout")}</button>`;

  $("#profile-lang").onchange = e => { setLang(e.target.value); renderApp(); };
  $("#logout-btn").onclick = async () => {
    if (cloudReady && currentUser.type === "cloud") { try { await firebase.auth().signOut(); } catch (e) {} }
    localStorage.removeItem(LS_SESSION);
    currentUser = null; state = null; activeTab = "pets";
    renderAuth();
  };
  $("#export-btn").onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "dogcare-export.json";
    a.click();
  };
  $("#notif-btn").onclick = async () => {
    if (!("Notification" in window)) { alert(t("notif_unsupported")); return; }
    const perm = await Notification.requestPermission();
    if (perm === "granted") { alert(t("notif_on")); checkVaxNotifications(); }
    else alert(t("notif_denied"));
  };
}

/* Уведомления при открытии приложения */
function checkVaxNotifications() {
  if (!("Notification" in window) || Notification.permission !== "granted" || !state) return;
  state.vaccinations.filter(v => !v.done && petById(v.petId)).forEach(v => {
    const d = daysUntil(v.due);
    if (d >= 0 && d <= 7) {
      const pet = petById(v.petId);
      new Notification("💉 " + t("notif_soon", { pet: pet.name }), {
        body: vaxName(v.vaxId) + " — " + (d === 0 ? t("notif_today") : t("notif_in", { n: d, date: fmtDate(v.due) }))
      });
    }
  });
}

/* ===================== Запуск ===================== */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

async function boot() {
  if (cloudReady) {
    await completeMagicLink();
    try { await firebase.auth().getRedirectResult(); } catch (e) {}
    firebase.auth().onAuthStateChanged(fbUser => {
      if (fbUser) cloudLoginFromUser(fbUser);
      else if (!currentUser) startLocal();
    });
    // Если Firebase молчит (нет сети до gstatic) — не блокируем запуск
    setTimeout(() => { if (!currentUser && !$("#auth-submit")) startLocal(); }, 2500);
  } else {
    startLocal();
  }
}

function startLocal() {
  const raw = localStorage.getItem(LS_SESSION);
  if (raw) {
    try {
      const u = JSON.parse(raw);
      if (u.type === "local" && loadUsers()[u.email]) {
        currentUser = u;
        loadState();
        renderApp();
        checkVaxNotifications();
        return;
      }
      if (u.type === "cloud" && cloudReady) return; // ждём onAuthStateChanged
    } catch (e) {}
  }
  renderAuth();
}

boot();
</script>
</body>
</html>
