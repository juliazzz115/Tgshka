services:
  - type: web
    name: telegram-swiper
    env: python
    region: frankfurt
    buildCommand: pip install -r telegram_swiper_web/requirements.txt
    startCommand: cd telegram_swiper_web/backend && gunicorn --worker-class=gthread --workers=1 --threads=4 --bind 0.0.0.0:$PORT app:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
